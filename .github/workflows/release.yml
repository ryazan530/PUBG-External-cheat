name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "BzWare ${{ github.ref_name }}"
          body: |
            ## 🎮 BzWare ${{ github.ref_name }}

            **External Cheat For PUBG With Included Spoofer**

            ### ⬇️ Download
            Download **`loader.exe`** from the assets below (uploaded with the release).

            ### 🌟 Features
            - **Aimbot** — Bone · FOV · Smooth · Hardlock · Predict
            - **Player ESP** — Box · Skeleton · Head · Health · Names · Distance
            - **Item ESP** — Weapons · Loot · Air Drops · Attachments
            - **Radar** — Scale · Lines · Transparency
            - **Misc** — No Recoil · No Sway · **HWID Spoofer**

            ### ⌨️ Controls
            - **INSERT** — Open / close menu
            - **END** — Exit

            ### 📦 Installation
            1. Download `loader.exe` from this Release
            2. Run it (no install)
            3. Launch PUBG and press INSERT

            ---

            [![Discord](https://img.shields.io/badge/Support-Discord-5865F2?logo=discord)](https://discord.gg/cYQQvaZRgE)

            ⭐ Star the repo for more updates!
          draft: false
          prerelease: false
